<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BOĞAZ TOUR 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd6f7;font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#14213a;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(20,33,58,.14);border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.22)}
#hud{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 6px);left:6px;right:6px;display:flex;gap:6px;align-items:flex-start;pointer-events:none}
#plist{display:flex;gap:5px;flex:1;overflow-x:auto;pointer-events:auto;padding-bottom:2px}
.pc{flex:1 0 auto;min-width:78px;max-width:130px;padding:4px 8px 4px 9px;border-radius:12px;font-size:12px;line-height:1.25;border-left:6px solid var(--c);transition:transform .15s}
.pc b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .cs{font-weight:700;font-size:14px}
.pc small{opacity:.7}
.pc.cur{outline:2px solid #f5a623;transform:scale(1.05)}
.pc.dead{opacity:.35;text-decoration:line-through}
#hb{display:flex;flex-direction:column;gap:5px;pointer-events:auto}
.ib{width:38px;height:38px;border-radius:50%;font-size:17px;padding:0;display:grid;place-items:center}
#rnd{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 62px);left:50%;transform:translateX(-50%);padding:3px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.05em;white-space:nowrap;pointer-events:none}
#dock{position:fixed;z-index:5;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;justify-content:center;pointer-events:none}
#dock>*{pointer-events:auto}
#mainb{min-width:min(70vw,17rem);padding:15px 24px;border-radius:999px;border:0;background:#f5a623;color:#fff;font:800 17px/1 system-ui;letter-spacing:.08em;box-shadow:0 6px 20px rgba(0,0,0,.35);transition:transform .1s,opacity .15s}
#mainb:active:not(:disabled){transform:scale(.96)}
#mainb:disabled{background:#6b7688;opacity:.85;cursor:default}
#mainb.go{animation:pul 1.2s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.05)}}
#dice{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:flex;gap:22px;perspective:700px;pointer-events:none;opacity:0;transition:opacity .25s}
#dice.on{opacity:1}
.die{width:54px;height:54px;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.fc{position:absolute;inset:0;background:#fff;border:1px solid #bbb;border-radius:10px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px;box-shadow:inset 0 0 8px rgba(0,0,0,.12)}
.fc i{display:block;place-self:center;width:8px;height:8px;border-radius:50%;background:transparent}
.fc i.p{background:#1c2433}
.fc:nth-child(1){transform:translateZ(27px)}
.fc:nth-child(2){transform:rotateY(180deg) translateZ(27px)}
.fc:nth-child(3){transform:rotateY(90deg) translateZ(27px)}
.fc:nth-child(4){transform:rotateY(-90deg) translateZ(27px)}
.fc:nth-child(5){transform:rotateX(90deg) translateZ(27px)}
.fc:nth-child(6){transform:rotateX(-90deg) translateZ(27px)}
#toast{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);max-width:min(90vw,26rem);padding:7px 14px;border-radius:12px;background:rgba(12,22,40,.9);color:#fff;font-size:13px;text-align:center;pointer-events:none;transition:opacity .25s}
#toast.off{opacity:0}
.fl{position:fixed;z-index:9;font:800 17px system-ui;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.5);animation:fl 1.4s ease-out forwards}
@keyframes fl{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-44px)}}
#md,#sh{position:fixed;inset:0;z-index:12;background:rgba(5,10,24,.35);display:flex;align-items:flex-end;justify-content:center}
#md[hidden],#sh[hidden]{display:none}
#mdc,#shc{width:min(100%,28rem);max-height:80vh;overflow:auto;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 14px);border-radius:20px 20px 0 0;background:rgba(255,255,255,.97)}
@media(min-width:700px){#md,#sh{align-items:center}#mdc,#shc{border-radius:20px}}
#mdc h3,#shc h3{margin:0 0 8px;font-size:18px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.btns.grid{display:grid;grid-template-columns:1fr 1fr}
.bn{padding:12px 10px;border-radius:12px;border:1px solid rgba(20,33,58,.25);background:#fff;font-weight:700;color:#14213a}
.bn.pri{background:#f5a623;color:#fff;border-color:transparent}
.bn.gr{background:#16a34a;color:#fff;border-color:transparent}
.bn:disabled{opacity:.4;cursor:not-allowed}
.bn small{display:block;font-weight:500;opacity:.85;font-size:11px}
.cardh{border-radius:12px;overflow:hidden;border:1px solid rgba(20,33,58,.2)}
.cat-meta{display:flex;align-items:center;gap:9px;margin:0 0 7px;padding:7px 9px;border:1px solid rgba(20,33,58,.12);border-left:4px solid var(--cat);border-radius:12px;background:linear-gradient(135deg,#fff,#f0f5f2);color:#233d49}.cat-meta .cat-icon{width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 1px rgba(20,33,58,.1)}.cat-meta svg{width:23px;height:23px;fill:none;stroke:var(--cat);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.cat-meta strong{display:block;font-size:13px;font-weight:900;letter-spacing:.03em}.cat-meta small{display:block;margin-top:1px;color:#607178;font-size:10px;font-weight:700;letter-spacing:.04em}.property-state{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 2px 0;padding:8px 10px;border-radius:10px;background:#eef3f1;color:#334a53;font-size:12px}.property-state b{font-size:12px}.property-state.sale{background:#e4f5ec;color:#146346}.property-state.rival{background:#f0eaf0;color:#503746}.property-state.owner,.property-state.rival{border-left:4px solid var(--owner)}.property-state small{display:block;font-size:11px;color:#536971}
.cardh .hd{padding:8px 12px;color:#fff;font-weight:800;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.cardh table{width:100%;border-collapse:collapse;font-size:13px}
.cardh td{padding:4px 12px;border-top:1px solid rgba(20,33,58,.1)}
.cardh td:last-child{text-align:right;font-weight:700}
.cardh tr.cu{background:rgba(245,166,35,.25)}
.tabs{display:flex;gap:4px;margin-bottom:8px;overflow-x:auto}
.tabs button{border:1px solid rgba(20,33,58,.2);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap}
.tabs button.on{background:#f5a623;color:#fff;border-color:transparent}
.row2{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(20,33,58,.08);font-size:13px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
#mm{position:fixed;inset:0;z-index:20;display:flex;overflow:auto;color:#f4f1e8;background:linear-gradient(180deg,#040a16 0%,#0a2748 45%,#0e4b6b 80%,#0a3a4f 100%);padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
#mm.gone{display:none}
.mi{margin:auto;width:100%;max-width:26rem;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.mi h1{margin:0;font-size:clamp(2.2rem,12vw,3.8rem);letter-spacing:.1em;font-weight:900;background:linear-gradient(180deg,#fff6dc,#ffd27a 55%,#e2a02f);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
.mi .sub{margin:0;color:#7fe6df;letter-spacing:.24em;font-weight:700;font-size:.8rem}
.mi .desc{margin:0;opacity:.88;max-width:22rem}
.mi label{display:flex;gap:8px;align-items:center;font-weight:600}
.mi input{padding:9px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font:inherit;width:9rem}
.seg{display:flex;gap:6px}
.seg button{width:52px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-weight:800}
.seg button.on{background:#f5a623;border-color:transparent}
.big{width:min(82vw,22rem);min-height:54px;border-radius:14px;border:0;font-weight:800;letter-spacing:.12em;font-size:1rem;color:#0b1626;background:linear-gradient(120deg,#ffd27a,#f0a92e 60%,#36d3c8 140%);box-shadow:0 8px 24px rgba(240,169,46,.3)}
.big.sec{background:rgba(255,255,255,.1);color:#f4f1e8;border:1px solid rgba(255,255,255,.28);box-shadow:none}
.big:disabled{opacity:.4;cursor:not-allowed}
#dice{display:none!important}
.cf{position:fixed;top:-14px;width:9px;height:14px;z-index:30;pointer-events:none;animation:cfall linear forwards}@keyframes cfall{to{transform:translateY(112vh) rotate(720deg)}}

/* Board Visual 02 controls: compact, tactile quality/look selectors. */
.v2-panel{margin:10px 0 14px;padding:12px;border-radius:16px;border:1px solid rgba(39,62,78,.18);background:linear-gradient(145deg,rgba(245,249,250,.98),rgba(226,237,238,.94));box-shadow:inset 0 1px rgba(255,255,255,.85),0 5px 16px rgba(20,33,58,.08)}
.v2-panel h3{margin:0 0 7px!important;font-size:14px!important;letter-spacing:.04em;color:#233e4b}
.v2-panel p{margin:0 0 8px;font-size:11px;line-height:1.4;color:#51636b}
.v2-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}

.v2-status{margin-top:8px;padding:7px 9px;border-radius:9px;background:rgba(27,49,61,.07);font-size:10px;line-height:1.4;color:#435863}
.v2-cameras{margin-top:10px}
.v2-cameras .v2-choice{min-height:38px}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hud"><div id="plist"></div><div id="hb"><button class="ib glass" id="bMenu" aria-label="Menü">☰</button><button class="ib glass" id="bCam" aria-label="Kamera">⌖</button><button class="ib glass" id="bSnd" aria-label="Ses">🔊</button></div></div>

<div id="dice"><div class="die" id="d1"></div><div class="die" id="d2"></div></div>

<div id="md" hidden><div id="mdc"><h3 id="mdt"></h3><div id="mdb"></div><div class="btns" id="mdbtn"></div></div></div>
<div id="sh" hidden><div id="shc"><div class="tabs" id="shtabs"></div><div id="shb"></div><div class="btns"><button class="bn" id="shx">KAPAT</button></div></div></div>

<div id="mm"><div class="mi">
 <h1>BOĞAZ TOUR</h1><p class="sub">3D EMLAK &amp; TİCARET OYUNU</p>
 <p class="desc">Zar at, şehirleri satın al, bina dik, kira topla ve rakiplerini iflas ettir!</p>
 <label>Adın <input id="pn" maxlength="12" placeholder="Sen"></label>
 <div style="font-weight:600">Oyuncu sayısı</div>
 <div class="seg" id="npSeg"><button data-n="2">2</button><button data-n="3">3</button><button data-n="4" class="on">4</button></div>
 <div style="font-weight:600">Zorluk</div>
 <div class="seg" id="dfSeg"><button data-d="0" style="width:76px">Kolay</button><button data-d="1" class="on" style="width:76px">Normal</button><button data-d="2" style="width:76px">Zor</button></div>
 <button class="big" id="bStart">OYUNA BAŞLA</button>
 <button class="big sec" id="bCont" disabled>DEVAM ET</button>
 <button class="big sec" id="bHow">NASIL OYNANIR</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<!-- Pinned r128 classic-script postprocessing: all optional; normal renderer remains the fallback. -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/math/SimplexNoise.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/SSAOPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
/* ======================= VERİ ======================= */
const N=28,CS=2.9,K=CS/2.2,START_CASH=1500,SALARY=200,MAX_ROUND=30,SAVE_KEY="bogaztour_save_v1";
const GROUPS=[{c:"#8d5a3b",name:"ANADOLU",ink:"#fffaf0",sub:"rgba(255,250,240,.86)",icon:0},{c:"#38a7e8",name:"AKDENİZ",ink:"#14313e",sub:"rgba(20,49,62,.82)",icon:1},{c:"#e6679c",name:"BATI AVRUPA",ink:"#34212b",sub:"rgba(52,33,43,.82)",icon:2},{c:"#f3992a",name:"ORTA AVRUPA",ink:"#332414",sub:"rgba(51,36,20,.82)",icon:3},{c:"#e0463b",name:"AVRASYA",ink:"#20191a",sub:"rgba(32,25,26,.84)",icon:4},{c:"#c9a227",name:"DÜNYA ŞEHİRLERİ",ink:"#282416",sub:"rgba(40,36,22,.86)",icon:5}];
const CITIES=[["Trabzon",40],["Samsun",40],["Bursa",50],["Atina",70],["Roma",80],["Madrid",80],["Paris",100],["Milano",100],["Londra",120],["Berlin",140],["Viyana",140],["Prag",160],["Dubai",180],["Moskova",200],["Pekin",200],["Tokyo",240],["New York",260],["İstanbul",300]];
const LV=["Arsa","Ev","Apartman","Otel","Simge Yapı"],RM=[.12,.5,1.3,2.6,4],BM=[.5,.5,.75,1];
const LAY=["S","P0","P0","C","P0","T1","P1","R","P1","C","P1","P2","P2","P2","F","P3","P3","C","P3","T2","P4","U","P4","C","P4","P5","P5","P5"];
const TL=[],gcnt=[0,0,0,0,0,0];
LAY.forEach((c,i)=>{const t={i,type:"",name:"",g:-1,price:0};
 if(c[0]==="P"){const g=+c[1],city=CITIES[g*3+gcnt[g]++];t.type="prop";t.g=g;t.name=city[0];t.price=city[1]}
 else if(c==="S"){t.type="start";t.name="BAŞLANGIÇ"}else if(c==="C"){t.type="chance";t.name="ŞANS"}
 else if(c==="T1"){t.type="tax";t.name="GELİR VERGİSİ";t.tax="income"}else if(c==="T2"){t.type="tax";t.name="LÜKS VERGİ";t.tax="lux"}
 else if(c==="R"){t.type="rest";t.name="ADA TATİLİ"}else if(c==="F"){t.type="fest";t.name="DÜNYA ŞAMPİYONASI"}else if(c==="U"){t.type="tour";t.name="DÜNYA TURU"}
 TL.push(t)});
const money=n=>"₺"+Math.round(n).toLocaleString("tr-TR");
const sleepRaw=ms=>new Promise(r=>setTimeout(r,ms));
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function gridXY(i){if(i<=7)return[i,7];if(i<=14)return[7,7-(i-7)];if(i<=21)return[7-(i-14),0];return[0,i-21]}
const V=THREE.Vector3,TP=[],OUT=[],TAN=[],ANG=[];
for(let i=0;i<N;i++){const[x,z]=gridXY(i);TP.push(new V((x-3.5)*CS,0,(z-3.5)*CS));
 let o;if(i===0)o=new V(-1,0,1).normalize();else if(i===7)o=new V(1,0,1).normalize();else if(i===14)o=new V(1,0,-1).normalize();else if(i===21)o=new V(-1,0,-1).normalize();
 else if(i<7)o=new V(0,0,1);else if(i<14)o=new V(1,0,0);else if(i<21)o=new V(0,0,-1);else o=new V(-1,0,0);
 OUT.push(o);TAN.push(new V(-o.z,0,o.x));ANG.push(i%7===0?0:Math.atan2(o.x,o.z))}

/* ======================= OYUN DURUMU ======================= */
let G=null,RUN=0,rollRes=null,askRes=null;
function newState(np,name){
 const cols=["#e11d48","#2563eb","#16a34a","#d97706"],names=[name||"Sen","Elif","Mert","Deniz"];
 return{np,players:Array.from({length:np},(_,i)=>({id:i,name:names[i],color:cols[i],human:i===0,cash:START_CASH+(i&&npDf===2?500:0),pos:0,rest:0,alive:true})),
  own:Array(N).fill(-1),lvl:Array(N).fill(0),fest:Array(N).fill(0),df:npDf,cur:0,round:1,over:false,log:[],deck:shuf([...Array(CARDS.length).keys()]),di:0}}
const fullSet=(o,g)=>TL.filter(t=>t.g===g).every(t=>G.own[t.i]===o);
function rent(i){const t=TL[i],o=G.own[i];if(o<0)return 0;let r=t.price*RM[G.lvl[i]];if(fullSet(o,t.g))r*=1.5;if(G.fest[i])r*=2;return Math.round(r)}
const buildCost=i=>Math.round(TL[i].price*BM[G.lvl[i]]/5)*5;
function invested(i){let s=TL[i].price;for(let l=0;l<G.lvl[i];l++)s+=Math.round(TL[i].price*BM[l]/5)*5;return s}
const worth=p=>G.players[p].cash+TL.reduce((a,t)=>a+(t.type==="prop"&&G.own[t.i]===p?invested(t.i):0),0);
const ownedBy=p=>TL.filter(t=>t.type==="prop"&&G.own[t.i]===p).map(t=>t.i);
function say(m,quiet){if(!G)return;G.log.unshift("T"+G.round+": "+m);if(G.log.length>80)G.log.pop();if(!quiet)toast(m)}
let toastT=0;function toast(m){const t=$("toast");t.textContent=m;t.classList.remove("off");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add("off"),2600)}

/* ======================= SES ======================= */
let AC=null,MG=null,mute=false;
function au(){try{if(AC){if(AC.state==="suspended")AC.resume();return}const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();MG=AC.createGain();MG.gain.value=mute?0:.45;MG.connect(AC.destination)}catch(_){}}
function tn(f,d=.12,ty="sine",v=.2,dl=0){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+dl;o.type=ty;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.02)}catch(_){}}
function sfx(k){if(!AC)return;({hop:()=>tn(320,.08,"triangle",.15),tok:()=>{tn(170+Math.random()*70,.07,"triangle",.2);tn(95,.1,"sine",.22)},dice:()=>{for(let i=0;i<6;i++)tn(500+Math.random()*400,.04,"square",.05,i*.1)},coin:()=>{tn(1400,.1,"square",.06);tn(1900,.2,"square",.06,.08)},buy:()=>[523,659,784].forEach((f,i)=>tn(f,.25,"triangle",.14,i*.09)),bad:()=>{tn(220,.25,"sawtooth",.1);tn(160,.3,"sawtooth",.1,.15)},build:()=>{tn(180,.08,"square",.1);tn(240,.08,"square",.1,.1);tn(700,.2,"sine",.12,.2)}})[k]?.()}
addEventListener("pointerdown",au,{passive:true});

/* ======================= THREE SAHNE ======================= */

function cameraPreset(name,tileId=null,duration=900){const key=String(name||"").toLowerCase(),aspect=innerWidth/innerHeight;let target=new V(0,.12,0),dir=new V(.53,.66,.93),distance=32*K;if(key==="overview"){dir.set(.45,.78,.9);distance=(aspect<.8?48:aspect<1.2?37:32)*K;target.set(0,0,0)}else if(key==="threequarter"){dir.set(.72,.57,1);distance=34*K;target.set(0,.05,0)}else if(key==="close"){dir.set(.72,.62,.95);distance=23*K;target.set(.1,.15,.1)}else if(key==="water"){dir.set(.55,.66,.95);distance=18*K;target.set(0,.23,0)}else if(key==="tile"&&Number.isInteger(tileId)&&TP[tileId]){target.copy(TP[tileId]).setY(.46);dir.set(.46,.69,.92);distance=15*K}distance=Math.max(ctl.minDistance+1,Math.min(ctl.maxDistance,distance));cameraTweenTo(target.clone().add(dir.normalize().multiplyScalar(distance)),target,duration)}
function updateCameraTween(now){if(!cameraTween)return;const q=cameraTween,u=Math.min(1,(now-q.started)/q.duration),e=u*u*(3-2*u);cam.position.lerpVectors(q.from,q.to,e);ctl.target.lerpVectors(q.fromTarget,q.toTarget,e);if(u>=1)cameraTween=null}

 for(;;){let moved=false;
  for(const q of C){if(q.id===win||out.has(q.id))continue;const nb=bid+step;
   if(q.human){if(q.cash-100<nb){out.add(q.id);continue}
    const r=await ask({title:"🔨 İhale · "+t.name,html:propCard(i)+`<p style="margin:8px 0 0">Güncel teklif: <b>${win>=0?money(bid)+" ("+G.players[win].name+")":"yok"}</b></p>`,buttons:[{t:`TEKLİF VER<small>${money(nb)}</small>`,v:1,cls:"gr"},{t:"ÇEKİL",v:0}]});

function checkEnd(){

 if(alive.length<=1||!G.players[0].alive||G.round>MAX_ROUND){G.over=true;return true}return false}
function advance(){do{G.cur++;if(G.cur>=G.np){G.cur=0;G.round++}}while(!G.players[G.cur].alive&&G.players.some(p=>p.alive)&&G.round<=MAX_ROUND)}
async function takeTurn(P){
 G.pcur=P.id;updHUD();saveGame();
 if(P.rest>0){P.rest--;say(P.name+" tatilde, bu turu atlıyor.");setMain(P.name+" tatilde…",false);await sleep(1000);return}
 let dbl=0;diceShow(false);
 for(;;){
  if(P.human)await waitRoll();else{setMain(P.name+" oynuyor…",false);toast("Sıra: "+P.name);await sleep(900)}
  setMain("ZAR ATILIYOR…",false);
  const[a,b]=await rollDice();const isD=a===b;if(a===6&&b===6){say("🎰 JACKPOT! "+P.name+" 6-6 attı: +"+money(300));gain(P.id,300);if(P.human)ach("jp")}
  say(P.name+" zar attı: "+a+" + "+b+" = "+(a+b)+(isD?" (ÇİFT!)":""));
  if(isD){dbl++;if(dbl===3){say(P.name+" üst üste 3 çift attı → Ada Tatili!");await sleep(900);P.pos=7;await hopTo(P.id,7,true);P.rest=1;return}}
  if(P.human)setMain("HAREKET…",false);
  await moveBy(P.id,a+b);await sleep(250);
  await land(P.id);updHUD();
  if(!P.alive||G.over)return;
  if(checkEnd())return;
  if(isD&&P.rest===0){toast(P.name+" çift attı, tekrar atıyor!");await sleep(900);continue}
  return}}
